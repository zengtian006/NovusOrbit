# Global Page Settings - Applied to all users
# Controls page-level features like SSO requirements.
# Signed-out visitors can browse Home, Features and Guides, and try Upload CV
# (one CV) and Ask as a guest. Every other tool needs sign-in.

pages:
  "/":
    requireSSO: false

  "/ask":
    requireSSO: false

  "/portfolio":
    requireSSO: false
    
  "/history":
    requireSSO: true

  "/interview":
    requireSSO: true
    
  "/job-suggest":
    requireSSO: true
    
  "/resume-writer":
    requireSSO: true

  "/jobs":
    requireSSO: true
