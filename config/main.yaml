system:
  language: en
paths:
  user_data_dir: ./data/user
  portfolios_dir: ./data/portfolios
  user_log_dir: ./data/user/logs
tools:
  rag_tool:
    kb_base_dir: ./data/portfolios
  web_search:
    enabled: true
    consolidation: template
    consolidation_template: ''
    provider: jina
logging:
  # Global log level for the entire system (DEBUG, INFO, WARNING, ERROR)
  # This controls both NovusOrbit logs and RAG module logs
  level: DEBUG
  save_to_file: true
  console_output: true
  # RAG module logger name mapping (optional customization)
  rag_logger_names:
    knowledge_init: RAG-Init
    rag_tool: RAG
