<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#grad)"/>
  
  <!-- Orbit ring -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="white" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Center star/spark representing career growth -->
  <path d="M 16 6 L 17 13 L 24 13 L 18.5 17.5 L 21 24 L 16 20 L 11 24 L 13.5 17.5 L 8 13 L 15 13 Z" 
        fill="white" opacity="0.9"/>
  
  <!-- Small dots representing opportunities -->
  <circle cx="22" cy="10" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="26" cy="16" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="22" cy="22" r="1.5" fill="white" opacity="0.8"/>
</svg>
